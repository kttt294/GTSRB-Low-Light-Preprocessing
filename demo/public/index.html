<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="So sánh nhận dạng biển báo trước và sau xử lý ảnh thiếu sáng.">
  <title>GTSRB · Low Light Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="conditions" id="conditions" role="group" aria-label="Mức mô phỏng thiếu sáng">
        <button type="button" data-condition="original" aria-pressed="false">Ảnh gốc</button>
        <button type="button" data-condition="mild" aria-pressed="false">Tối nhẹ</button>
        <button type="button" data-condition="medium" aria-pressed="true">Tối vừa</button>
        <button type="button" data-condition="severe" aria-pressed="false">Tối nặng</button>
      </div>
    </header>

    <div class="topline">
      <div class="filename">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m4 17 5-5 4 4 3-3 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
        <span id="filename">Chọn một ảnh biển báo</span><span class="demo-note">Demo</span>
      </div>
      <span class="method">Gaussian → Gamma</span>
    </div>

    <p class="error" id="error" role="alert" hidden></p>
    <main class="comparison" id="comparison" aria-label="So sánh ảnh và kết quả nhận dạng" aria-busy="true">
      <div class="workspace">
      <div class="images">
        <section class="image-panel">
          <div class="panel-heading"><span>Trước xử lý</span></div>
          <div class="image-stage">
            <img id="before-image" alt="Ảnh đầu vào cho mô hình" hidden>
          </div>
        </section>
        <section class="image-panel">
          <div class="panel-heading"><span>Sau xử lý</span></div>
          <div class="image-stage"><img id="after-image" alt="Ảnh sau Gaussian rồi Gamma" hidden></div>
        </section>
      </div>
        <section class="image-panel compare-panel" aria-label="Ảnh trượt so sánh trước và sau xử lý">
          <div class="panel-heading"><span>Trượt so sánh</span></div>
          <div class="image-stage compare-stage">
            <img id="wipe-before-image" alt="Ảnh trước xử lý trong khung so sánh" hidden>
            <div class="wipe-overlay"><img id="overlay-image" alt="Ảnh sau xử lý để so sánh" hidden></div>
            <div class="wipe-divider" aria-hidden="true"></div>
            <div class="slider-wrap" id="slider-wrap">
              <label for="compare-slider"><span>Trước</span><span>Sau</span></label>
              <input type="range" id="compare-slider" min="0" max="100" value="50" aria-label="Mức hiển thị ảnh sau xử lý">
            </div>
          </div>
        </section>
      </div>
      <div class="predictions" aria-live="polite" aria-atomic="true">
        <div class="prediction" id="before-result">
          <span class="verdict" aria-hidden="true">—</span>
          <div><span class="prediction-caption" id="before-caption">ResNet dự đoán · ảnh đầu vào chưa tăng cường</span><strong id="before-label">—</strong></div>
        </div>
        <div class="prediction" id="after-result">
          <span class="verdict" aria-hidden="true">—</span>
          <div><span class="prediction-caption">ResNet dự đoán · ảnh sau Gaussian → Gamma</span><strong id="after-label">—</strong></div>
        </div>
        <div class="prediction ground-truth" id="truth-result">
          <div><span class="prediction-caption">Nhãn đúng (ground truth)</span><strong id="truth-label">—</strong></div>
        </div>
      </div>
      <div class="loading" id="loading" role="status"><span class="spinner" aria-hidden="true"></span><span id="loading-label">Đang tải kết quả…</span></div>
    </main>

    <div class="bottom">
      <div class="samples" id="samples" role="group" aria-label="30 ảnh mẫu GTSRB"></div>
    </div>
    <noscript>Bật JavaScript để dùng demo.</noscript>
  </div>
</body>
</html>
